[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  VITE_NETLIFY_FORMS = "1"

# SPA fallback — Netlify Functions are matched before this rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed Vite bundles can be cached forever. Image paths are stable, so keep
# those fresh within a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/gallery-opt/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/gig-pics/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
